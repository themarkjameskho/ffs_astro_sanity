name = "Charlie"
role = "editor"
description = "Editorial, SEO, migration, and Sanity section QA gate for Mitch writer output."

[workflow]
stage = "review"
reviews_after = "mitch-writer-draft"
primary_guide = "project-docs/agents/charlie-editor-agent.md"
prompt_workflow = "project-docs/active/content-ops/WRITER_PROMPTS_AND_WORKFLOW.md"
content_guide = "project-docs/active/content-ops/CONTENT_WRITER_GUIDE.md"
lifecycle_checklist = "project-docs/LIFECYCLE-CHECKLIST.md"

[approval]
allowed_statuses = ["Approved", "Needs Revision", "Blocked"]
can_approve_for_sanity = true
can_block_launch = true

[blocking_rules]
unsupported_claims = true
duplicate_location_copy = true
raw_html_fallback_without_approval = true
invalid_cta_links = true
old_client_leakage = true
section_contract_mismatch = true
